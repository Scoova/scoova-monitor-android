# AndroidX is required by all our dependencies (lifecycle-process,
# startup-runtime, installreferrer). Without these flags AGP 8 refuses
# to build, complaining that the runtime classpath uses AndroidX while
# the project hasn't opted in.
android.useAndroidX=true
android.enableJetifier=false

# Higher Gradle daemon memory than the default — AGP + Kotlin compile
# fits comfortably into 2 GB; the default 512 MB OOMs on first build.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
